# Default-deny front of the validator (#21). The validator listens on 127.0.0.1:8081 only;
# this server on port 8080 is the only exposed listener. Allowed, matched exactly:
#   POST /validateResource         -> validator (query parameters passed through)
#   GET  /health                   -> asks the validator on every request (auth_request)
#   GET  /openapi.json             -> our spec (docs/public/openapi.yaml, converted at build time)
# Anything else is 404; a wrong method on an allowed path is 405.
# nginx matches locations against the normalized path but proxy_pass without a URI forwards
# the raw one, so /stop/../validateResource would reach /stop. Hence each location rejects any
# raw path ($request_uri) that is not exactly its own, and proxy_pass names the upstream path.
# Runs as root or any other user with a read-only root filesystem: everything it writes is
# under /tmp (created by docker-entrypoint.sh) or goes to stdout/stderr (-e stderr).

daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout;
  server_tokens off;
  default_type application/octet-stream;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  upstream validator {
    server 127.0.0.1:8081;
  }

  server {
    listen 8080;

    location = /validateResource {
      if ($request_uri !~ "^/validateResource(\?|$)") {
        return 404;
      }
      if ($request_method != POST) {
        add_header Allow "POST" always;
        return 405;
      }
      # Large bundles; nginx buffers the body (to /tmp/nginx) before the single-threaded
      # validator sees it, so a slow upload does not block other requests.
      client_max_body_size 100m;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_http_version 1.1;
      proxy_pass http://validator/validateResource; # explicit path; the query string is appended
    }

    # Healthy only if the validator answers now: auth_request runs in the access phase on
    # every request (no cache). Do not replace this with `return`, which skips that phase.
    # Validator down or not ready -> 500; slower than 3 s (busy with a validation) -> 500.
    location = /health {
      if ($request_uri !~ "^/health(\?|$)") {
        return 404;
      }
      if ($request_method != GET) {
        add_header Allow "GET" always;
        return 405;
      }
      access_log off;
      auth_request /_ready;
      default_type application/json;
      add_header Cache-Control "no-store" always;
      alias /app/validator/health.json;
    }

    location = /_ready {
      internal;
      proxy_method GET;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_connect_timeout 3s;
      proxy_send_timeout 3s;
      proxy_read_timeout 3s;
      proxy_http_version 1.1;
      proxy_pass http://validator/openapi.json;
    }

    location = /openapi.json {
      if ($request_uri !~ "^/openapi\.json(\?|$)") {
        return 404;
      }
      if ($request_method != GET) {
        add_header Allow "GET" always;
        return 405;
      }
      default_type application/json;
      alias /app/validator/openapi.json;
    }

    location / {
      return 404;
    }
  }
}
