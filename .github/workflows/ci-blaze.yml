name: CI Blaze TermServer

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
    - main
    - develop

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Download MII terminology packages
      run: ./scripts/terminology/get-mii-terminology.sh install

    - name: Download SNOMED CT Release
      uses: ./.github/actions/speicherwolke-download
      with:
        token: ${{ secrets.SCT_DOWNLOAD_TOKEN }}
        filename: SnomedCT_InternationalRF2_PRODUCTION_20250701T120000Z.zip

    - name: Unzip SNOMED CT Release
      run: unzip SnomedCT_InternationalRF2_PRODUCTION_20250701T120000Z.zip -d snomed-ct-release
    
    - name: Prepare environment
      run: cp .env.default .env

    - name: Start services (CI mode) with Blaze profile (which is set by default in .env by step before)
      run: docker compose -f docker-compose.yml -f .github/configs/docker-compose.ci.yml up --build --wait
    
    - name: Upload MII terminology to Blaze
      run: ./scripts/terminology/upload-terminology.sh
    
    - name: Wait for validator to be ready
      run: |
        echo "Waiting for validator to start..."
        for i in {1..120}; do
          if docker compose logs validator 2>&1 | grep -q "FHIR Validator HTTP Service started"; then
            echo "Validator is ready!"
            break
          fi
          echo "Attempt $i/120: not ready yet..."
          sleep 3
        done
        if ! docker compose logs validator 2>&1 | grep -q "FHIR Validator HTTP Service started"; then
          echo "ERROR: Validator failed to start. Logs:"
          docker compose logs validator
          exit 1
        fi
    
    - name: Run validation test
      # Fails on fatal/error issues and on malformed or missing responses; results go to the artifact.
      run: OUT_DIR=validation-results ./scripts/test/validate-test-resources.sh

    - name: Upload OperationOutcome artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: validation-results
        path: validation-results/
        retention-days: 7
    
    - name: Show logs on failure
      if: failure()
      run: |
        echo "=== Docker Compose Logs ==="
        docker compose logs
        echo "=== Container Status ==="
        docker compose ps
    
    - name: Cleanup
      if: always()
      run: docker compose -f docker-compose.yml -f .github/configs/docker-compose.ci.yml down -v
