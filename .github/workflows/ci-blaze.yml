name: CI Blaze TermServer

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
    - main
    - develop

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Download MII terminology packages
      run: ./scripts/terminology/get-mii-terminology.sh install

    - name: Download SNOMED CT Release
      uses: ./.github/actions/snomed-ct-download
      with:
        token: ${{ secrets.SCT_DOWNLOAD_TOKEN }}
        umls-api-key: ${{ secrets.UMLS_API_KEY }}
        filename: SnomedCT_InternationalRF2_PRODUCTION_20250701T120000Z.zip

    - name: Unzip SNOMED CT Release
      run: unzip SnomedCT_InternationalRF2_PRODUCTION_20250701T120000Z.zip -d snomed-ct-release
    
    - name: Prepare environment
      run: cp .env.default .env

    - name: Start services (CI mode) with Blaze profile (which is set by default in .env by step before)
      # --wait returns once Blaze and the validator report healthy (image HEALTHCHECK: IGs loaded,
      # HTTP served). The timeout starts after the build and covers Blaze plus validator startup.
      run: docker compose -f docker-compose.yml -f .github/configs/docker-compose.ci.yml up --build --wait --wait-timeout 600

    - name: Upload MII terminology to Blaze
      run: ./scripts/terminology/upload-terminology.sh

    - name: Run validation test
      # Fails on fatal/error issues and on malformed or missing responses; results go to the artifact.
      run: OUT_DIR=validation-results ./scripts/test/validate-test-resources.sh

    - name: A wrong display is an error by default (#27)
      run: ./scripts/test/check-display-mode.sh error

    - name: A wrong display is a warning with DISPLAY_ISSUES_ARE_WARNINGS=true (#27)
      # The shell variable overrides .env; compose recreates only the validator (tx cache volume kept).
      run: |
        DISPLAY_ISSUES_ARE_WARNINGS=true docker compose -f docker-compose.yml -f .github/configs/docker-compose.ci.yml \
          up -d --wait --wait-timeout 600 validator
        ./scripts/test/check-display-mode.sh warning

    - name: Upload OperationOutcome artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: validation-results
        path: validation-results/
        retention-days: 7
    
    - name: Show logs on failure
      if: failure()
      run: |
        echo "=== Docker Compose Logs ==="
        docker compose logs
        echo "=== Container Status ==="
        docker compose ps
    
    - name: Cleanup
      if: always()
      run: docker compose -f docker-compose.yml -f .github/configs/docker-compose.ci.yml down -v
