openapi: 3.1.0
info:
  title: MII FHIR Validator API
  description: |
    HTTP API of the MII FHIR Validator, based on the [FHIR Validator CLI](https://confluence.hl7.org/spaces/FHIR/pages/35718580/Using+the+FHIR+Validator) running in server mode.

    The validator accepts FHIR resources (JSON or XML) and returns an `OperationOutcome` with validation results.

    Only the operations documented here are available. The other endpoints of the FHIR Validator CLI server (e.g. `/fhirpath`, `/convert`, `/loadIG`, `/stop`) are not exposed and return `404 Not Found`. A wrong HTTP method on a documented path returns `405 Method Not Allowed`.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: MII FHIR Validator on GitHub
  url: https://github.com/medizininformatik-initiative/mii-fhir-validator
servers:
  - url: http://localhost:8080
    description: Local instance
tags:
  - name: validation
    description: FHIR resource validation
  - name: operations
    description: Health probe and API description
paths:
  /health:
    get:
      tags:
        - operations
      summary: Readiness of the validator
      description: |
        Returns `200` with `{"status":"UP"}` when the validator has loaded the Implementation Guides and answers HTTP requests. Every call asks the validator; nothing is cached.

        The validator handles one request at a time, so `/health` also fails while a long validation is running. Use it as a readiness probe with enough tolerance (see the documentation on health checks), not to decide whether to restart the container after a single failure.

        Healthy does not mean the terminology server is reachable or loaded.
      operationId: health
      responses:
        "200":
          description: The validator is ready.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [UP]
              example:
                status: UP
        "500":
          description: The validator is not ready (still loading, stopped, or busy for longer than 3 s).
  /openapi.json:
    get:
      tags:
        - operations
      summary: This API description
      description: Returns this OpenAPI document as JSON.
      operationId: openapi
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
  /validateResource:
    post:
      tags:
        - validation
      summary: Validate a FHIR resource
      description: |
        Validates the submitted FHIR resource against the loaded Implementation Guides and returns an `OperationOutcome`.

        - Use the `Content-Type` header to specify the format of the submitted resource (JSON or XML).
        - Use the `Accept` header to specify the desired response format.
        - Use the `profile` query parameter to validate against additional StructureDefinition canonical URLs, one URL per occurrence (`?profile=A&profile=B`). The profiles declared in `meta.profile` of the resource are always checked.
        - Unknown query parameters and invalid values are rejected with `400 Bad Request`. Parameter names and enum values are case-sensitive unless stated otherwise.
        - The parameters below are the ones relevant for MII validation. The FHIR Validator CLI accepts further parameters (e.g. `jurisdiction`, `maxValidationMessages`, `validationTimeout`); see its documentation.

        | Severity | Meaning |
        |---|---|
        | `fatal` | The issue caused the action to fail and no further checking could be performed. |
        | `error` | The issue is sufficiently important to cause the action to fail. |
        | `warning` | The action succeeded but may have been performed suboptimally or not as desired — should be reviewed. |
        | `information` | Informational only; no relation to success or failure (e.g. "All OK"). |
      operationId: validateResource
      externalDocs:
        description: FHIR Validator CLI – Calling the service
        url: https://confluence.hl7.org/spaces/FHIR/pages/35718580/Using+the+FHIR+Validator#UsingtheFHIRValidator-Callingtheservice%3A
      parameters:
        - name: profile
          in: query
          required: false
          description: |
            StructureDefinition canonical URL to validate the resource against, in addition to the profiles in `meta.profile`.
            Repeat the parameter for several profiles (`?profile=A&profile=B`); a comma-separated list is not split.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          example:
            - https://www.medizininformatik-initiative.de/fhir/core/modul-person/StructureDefinition/Vitalstatus
        - name: resourceIdRule
          in: query
          required: false
          description: |
            Whether the resource must have an `id`. Case-insensitive.
            If omitted, the validator's default applies.
          schema:
            type: string
            enum: [optional, required, prohibited]
        - name: extension
          in: query
          required: false
          description: |
            Extensions that are allowed even though no loaded IG defines them. Repeatable.
            `any` allows all unknown extensions; any other value is a URL prefix (extension domain): extensions whose URL starts with it are allowed.
            If omitted, unknown extensions are reported as errors.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          example:
            - any
        - name: bestPractice
          in: query
          required: false
          description: Severity used for best-practice recommendations (e.g. missing narrative, constraint `dom-6`). Case-sensitive.
          schema:
            type: string
            enum: [Ignore, Hint, Warning, Error]
            default: Warning
        - name: checkDisplay
          in: query
          required: false
          description: |
            How `Coding.display` values are compared with the terminology server's displays. Case-sensitive.
            If omitted, the validator's default applies.
          schema:
            type: string
            enum: [Ignore, Check, CheckCaseAndSpace, CheckCase, CheckSpace]
      requestBody:
        description: FHIR resource to validate, serialised as FHIR JSON or FHIR XML.
        required: true
        content:
          application/fhir+json:
            examples:
              Resource:
                summary: Example Observation
                value: |-
                  {
                    "resourceType": "Observation",
                    "id": "mii-exa-person-observation-vitalstatus",
                    "meta": {
                      "security": [
                        {
                          "code": "HTEST",
                          "system": "http://terminology.hl7.org/CodeSystem/v3-ActReason",
                          "display": "test health data"
                        }
                      ],
                      "profile": [
                        "https://www.medizininformatik-initiative.de/fhir/core/modul-person/StructureDefinition/Vitalstatus|2026.0.0"
                      ]
                    },
                    "category": [
                      {
                        "coding": [
                          {
                            "code": "survey",
                            "system": "http://terminology.hl7.org/CodeSystem/observation-category"
                          }
                        ]
                      }
                    ],
                    "status": "final",
                    "code": {
                      "coding": [
                        {
                          "code": "67162-8",
                          "system": "http://loinc.org"
                        }
                      ]
                    },
                    "subject": {
                      "reference": "Patient/mii-exa-person-patient-1"
                    },
                    "encounter": {
                      "reference": "Encounter/mii-exa-fall-kontakt-gesundheitseinrichtung-9"
                    },
                    "effectiveDateTime": "2020-01-08T07:00:00+01:00",
                    "valueCodeableConcept": {
                      "coding": [
                        {
                          "code": "L",
                          "system": "https://www.medizininformatik-initiative.de/fhir/core/modul-person/CodeSystem/Vitalstatus",
                          "display": "Patient lebt"
                        }
                      ]
                    }
                  }
      responses:
        "200":
          description: |
            Validation completed. The `OperationOutcome` contains all issues found.
            Issues with severity `error` or `fatal` indicate a validation failure.
            A response containing only `warning` and `information`-severity issues indicates success.
          content:
            application/fhir+json:
              schema:
                $ref: "#/components/schemas/OperationOutcome"
              examples:
                Response:
                  summary: Successful validation (All OK)
                  value: |-
                    {
                      "resourceType": "OperationOutcome",
                      "text": {
                        "status": "generated",
                        "div": "<div xmlns=\"http://www.w3.org/1999/xhtml\"><p>All OK</p></div>"
                      },
                      "issue": [
                        {
                          "severity": "information",
                          "code": "informational",
                          "details": {
                            "text": "All OK"
                          }
                        }
                      ]
                    }
        "400":
          description: |
            Bad Request: an unknown query parameter (`Unable to process param <name>=<value>`) or an invalid value (e.g. `No enum constant …` for a wrongly cased `bestPractice`).
          content:
            application/fhir+json:
              schema:
                $ref: "#/components/schemas/OperationOutcome"
        "405":
          description: Method not allowed. Only POST is supported.
        "500":
          description: >-
            Validation could not be run, e.g. a `profile` URL that is not in the loaded IGs (`Validation failed: Unable to resolve profile …`).
          content:
            application/fhir+json:
              schema:
                $ref: "#/components/schemas/OperationOutcome"
components:
  schemas:
    OperationOutcome:
      type: object
      description: FHIR OperationOutcome resource containing validation results.
      example:
        resourceType: OperationOutcome
        text:
          status: generated
          div: '<div xmlns="http://www.w3.org/1999/xhtml"><p>All OK</p></div>'
        issue:
          - severity: information
            code: informational
            details:
              text: All OK
      externalDocs:
        description: FHIR R4 OperationOutcome
        url: http://hl7.org/fhir/R4/operationoutcome.html
      required:
        - resourceType
        - issue
      properties:
        resourceType:
          type: string
          enum:
            - OperationOutcome
        text:
          type: object
          description: "FHIR type: Narrative. Human-readable narrative summary of the resource."
          properties:
            status:
              type: string
              description: "FHIR type: code. Narrative status — always `generated` for validator output."
              enum: [generated, extensions, additional, empty]
            div:
              type: string
              description: "FHIR type: xhtml. Limited XHTML content of the narrative."
        issue:
          type: array
          items:
            $ref: "#/components/schemas/OperationOutcomeIssue"
    OperationOutcomeIssue:
      type: object
      description: "FHIR type: BackboneElement (OperationOutcome.issue)"
      required:
        - severity
        - code
      properties:
        severity:
          type: string
          description: "FHIR type: code (http://hl7.org/fhir/issue-severity)."
          enum:
            - fatal
            - error
            - warning
            - information
        code:
          type: string
          description: "FHIR type: code (http://hl7.org/fhir/issue-type)."
        details:
          type: object
          description: "FHIR type: CodeableConcept. Additional details about the issue."
          properties:
            text:
              type: string
              description: "FHIR type: string. Human-readable description of the issue."
        diagnostics:
          type: string
          description: "FHIR type: string. Additional technical details about the issue, e.g. the offending value or expression."
        location:
          type: array
          description: "FHIR type: string[]. Deprecated in R4B+ in favour of `expression`. XPath or FHIRPath location(s) within the resource where the issue was found."
          items:
            type: string
        expression:
          type: array
          description: "FHIR type: string[]. FHIRPath expression(s) identifying the location of the issue."
          items:
            type: string
